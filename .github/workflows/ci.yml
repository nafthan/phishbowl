name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'   # weekly, so the real-sample check runs even when nothing changes

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
        exclude:
          - os: windows-latest
            node: 24
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Smoke test the built CLI
        shell: bash
        run: |
          node dist/cli.js --version
          set +e
          node dist/cli.js test/fixtures/example-northwind-payroll.eml --own northwind.example --no-color
          code=$?
          set -e
          [ "$code" -eq 3 ] || { echo "expected exit code 3 (malicious), got $code"; exit 1; }

  real-samples:
    # Real phishing (Phishing Pot, CC BY-NC 4.0) and real legitimate mail (SpamAssassin corpus, library fixtures).
    # Fetched each run (cached by pinned versions), never committed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: samples/.cache
          key: samples-${{ hashFiles('scripts/sample-sets.json') }}
      - run: npm run samples
      - run: npm run test:real
