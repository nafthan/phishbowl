<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--PB:CSP-->
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Phishbowl</title>
<!--PB:ICON-->
<style>/*PB:FONTS*/</style>
<style>/*PB:CSS*/</style>
</head>
<body>
<a class="skip" href="#page">Skip to content</a>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Navigation">
    <div class="sb-brand"><!--PB:LOGO--><span class="sb-name">Phishbowl</span><span class="sb-mode" id="mode"></span></div>
    <nav class="sb-nav" id="nav" aria-label="Pages"></nav>
    <div class="sb-foot">
      <label class="sb-theme"><span>Appearance</span>
        <select id="theme" class="select"><option value="">System</option><option value="light">Light</option><option value="dark">Dark</option><option value="night">Night</option></select></label>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu" type="button" id="b-menu" aria-label="Open navigation" aria-controls="sidebar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
      <div class="top-actions">
        <button class="search-trigger" type="button" id="b-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Search</span><kbd>⌘K</kbd></button>
        <button class="btn outline" type="button" id="b-snapshot" hidden>Save as HTML</button>
      </div>
    </header>
    <main class="page" id="page" tabindex="-1"></main>
  </div>
</div>

<!-- hidden inputs the pages use -->
<input type="file" id="file" multiple accept=".eml,.msg,.txt,message/rfc822,application/vnd.ms-outlook" hidden>

<!-- command palette -->
<div class="palette" id="palette" hidden role="dialog" aria-modal="true" aria-label="Search">
  <div class="pal-box">
    <div class="pal-input"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="pal-q" type="text" placeholder="Search emails, sections and actions…" autocomplete="off" spellcheck="false" aria-label="Search"></div>
    <div class="pal-list" id="pal-list" role="listbox"></div>
    <div class="pal-foot"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>↵</kbd> open</span><span><kbd>esc</kbd> close</span></div>
  </div>
</div>
<div class="dropveil" id="veil" aria-hidden="true"><div class="dv-card"><b>Drop to analyse</b><span>.eml, .msg or a text file</span></div></div>
<script id="pb-config" type="application/json">/*PB:CONFIG*/</script>
<script id="pb-data" type="application/json">/*PB:DATA*/</script>
<script>/*PB:JS*/</script>
</body>
</html>
